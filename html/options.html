<!DOCTYPE html> 
<html>
	<head>
        <script src="../js/options.js" type="module"></script>
		<link rel="stylesheet" href="../styles/simple.css">
		<title> Memory - Opcions </title>
	</head>
	<body>
		<div class="panel">
			<h1 id="optionsTitle">Opcions</h1>
            <div class="form-grid">
                <label for="pairs">Número de cartes</label>
                <input type="number" id="pairs" value="2" min="2" max="6">
                <label for="sizePairs">Mida de les parelles</label>
                <input type="number" id="sizePairs" value="2" min="2" max="4">
                <label for="penalty">Penalització d'error</label>
                <input type="number" id="penalty" value="1" min="1" max="4">
                <label for="dif">Dificultat</label>
                <select id="dif">
                    <option value="easy">Baixa</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Alta</option>
                </select>
                <div class="actions">
                    <button id="default">Per defecte</button>
                    <button id="apply">Aplicar</button>
                </div>
            </div>
        </div>
	</body>
</html>
